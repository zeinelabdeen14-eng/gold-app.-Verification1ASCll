<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>نظام إدارة حسابات الذهب والمسبك</title>

  <!-- مكتبات فايبريس (Firebase) للمزامنة اللحظية السحابية -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --surface-3: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --gold-light: #fcd34d;
      --gold-bg: rgba(245, 158, 11, 0.14);
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.14);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.14);
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.14);
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Cairo, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    .topbar {
      background: linear-gradient(135deg, #0F172A 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold; color: #FFF; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .brand h1 { font-size: 1.15rem; font-weight: 700; color: var(--gold-light); }
    .brand p { font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">💎</div>
      <div>
        <h1>نظام إدارة حسابات الذهب والمسبك</h1>
        <p>متصل بالسحابة (محدث لحظياً)</p>
      </div>
    </div>
  </header>

  <div style="padding: 20px; text-align: center;">
    <h2>جاري تحميل النظام والربط السحابي...</h2>
  </div>

  <script>
    // إعدادات ربط فايبريس (استبدلها ببيانات مشروعك لاحقاً)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    // تهيئة فايبريس وقاعدة البيانات
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // دالة المزامنة والاستماع للتحديثات اللحظية بين الموبايل والكمبيوتر
    db.collection("goldData").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      let records = [];
      snapshot.forEach((doc) => {
        records.push({ id: doc.id, ...doc.data() });
      });
      console.log("تم تحديث البيانات سحابياً:", records);
    });
  </script>
</body>
</html>
